<script>
	//Load timing for analytics, all times are ms since navigation start (performance.now()). Read by Unity via getLoadStats()
	var loadTiming = { loaderStartMs: -1, unityReadyMs: -1, cdnEntries: [], observer: null, returningBrowser: -1, buildFiles: null };

	//returning browser = Unity's IndexedDB cache (bundles + data file, keyed by url) already existed before this load, -1 when the browser can't tell
	try
	{
		if (indexedDB.databases) indexedDB.databases().then((dbs) => { loadTiming.returningBrowser = dbs.some((db) => db.name && db.name.indexOf("UnityCache") >= 0) ? 1 : 0; }).catch(() => {});
	}
	catch (e) {}
	try
	{
		//keep build file and addressables requests (either CDN) so they can't be lost when the browser's resource timing buffer fills up with ad requests
		loadTiming.observer = new PerformanceObserver((list) => addCdnTimingEntries(list.getEntries()));
		loadTiming.observer.observe({ type: "resource", buffered: true });
	}
	catch (e) {}

	function addCdnTimingEntries(entries)
	{
		for (var i = 0; i < entries.length; i++)
		{
			var name = entries[i].name;
			if (name.indexOf("/Build2020New/") >= 0 || name.indexOf("/assetbundles/") >= 0) loadTiming.cdnEntries.push(entries[i]);
		}
	}

	//Used for installing progressive web apps
	if ('serviceWorker' in navigator)
	{
		navigator.serviceWorker.register('service-worker2.js');
	}

	const firebaseConfig = {
    apiKey: "AIzaSyAdY2qq9083amKDS0R8tn2tjIKQB8mocco",
    authDomain: "webgltest-17af1.firebaseapp.com",
    databaseURL: "https://webgltest-17af1.firebaseio.com",
    projectId: "webgltest-17af1",
    messagingSenderId: "480659433590",
    appId: "1:480659433590:web:a01ad1599e963843a0d757",
    measurementId: "G-1W23DRFHK9"
};

	
	// Initialize Firebase
	firebase.initializeApp(firebaseConfig);

	

	analytics = firebase.analytics();
	gtag('config', 'G-1W23DRFHK9', {'cookie_flags': 'samesite=none;secure'}); 
	
	firebaseSetScreen("loading_start");
	firebaseLogEvent("loading_page_start");

	updateAdBlockDetected();
	updateLoadingAdBanner();
	
	var timerStart = Date.now();
	var sentGameInstanceStartEvent = false;

	// choose the data file based on whether there's support for the ASTC texture compression format
	var dataFile = "/9ed5ebdcf60b83284c588509e3bd6496.data.br";
	var mobileDataFile = "/72ba35765c28abeb1263fb2c640d2971.data.br";
    
    var addressableCatalogFilename = "catalog_2026.10.19.09.40.34.json";
    var mobileAddressableCatalogFilename = "catalog_2026.10.19.09.41.27.json";
	
	//safety check to ensure we dont try to use the mobileDataFile if the filename hasnt been parsed during the build phase
	if(!mobileDataFile.includes("MOBILE_DATA_FILENAME"))
	{
		var c = document.createElement("canvas");
		var gl = c.getContext("webgl");
		var gl2 = c.getContext("webgl2");
		if ((gl && gl.getExtension('WEBGL_compressed_texture_astc')) || (gl2 && gl2.getExtension('WEBGL_compressed_texture_astc'))) 
		{
			dataFile = mobileDataFile;
            
            if(!mobileAddressableCatalogFilename.includes("MOBILE_ADDRESSABLE_CATALOG_FILENAME"))
            {
                addressableCatalogFilename = mobileAddressableCatalogFilename;
            }
		}
	}

	//CDN A/B split: each player is put on Bunny or Cloudflare R2 and kept there (localStorage) so their browser cache stays warm.
//?cdn=bunny or ?cdn=cf forces one for this load without changing the stored choice
const cdnSplitCfPercent = 50;
//R2 only allows CORS from these hosts, everywhere else (proxies, portals) stays on Bunny
const cdnSplitCfHosts = ["smashkarts.io", "www.smashkarts.io", "smashkarts-dev.firebaseapp.com", "smashkarts-dev.web.app", "localhost"];
const cdnUrls = {
	bunny: { build: "https://smashkartsgc.b-cdn.net/Build2020New", addressables: "https://smashkartsgc.b-cdn.net/assetbundles/remote/webgl" },
	cf: { build: "https://cdn.tall.team/Build2020New", addressables: "https://cdn.tall.team/assetbundles/remote/webgl" },
};
var cdnIsNew = false;
const cdnName = (function ()
{
	if (cdnSplitCfHosts.indexOf(window.location.hostname) < 0) return "bunny";

	try
	{
		var forced = new URLSearchParams(window.location.search).get("cdn");
		if (cdnUrls[forced]) return forced;
	}
	catch (e) {}

	var stored = null;
	try { stored = localStorage.getItem("skCdn"); } catch (e) {}
	if (cdnUrls[stored]) return stored;

	cdnIsNew = true;
	var picked = (Math.random() * 100 < cdnSplitCfPercent) ? "cf" : "bunny";
	try { localStorage.setItem("skCdn", picked); } catch (e) {}
	return picked;
})();
const buildUrl = cdnUrls[cdnName].build;
const addressablesUrl = cdnUrls[cdnName].addressables;

	//lets every firebase analytics event (old and new) be split by CDN
	if (typeof cdnName !== "undefined" && enableFirebaseAnalytics && firebase.analytics != null) firebase.analytics().setUserProperties({ cdn: cdnName });
	const loaderUrl = buildUrl + "/c4ce55f6fd990c1236bc84106eb955bf.loader.js";
	const config = {
		dataUrl: buildUrl + dataFile,
		frameworkUrl: buildUrl + "/bf5c9ad9327117f1a9bf7ffae7911187.framework.js.br",
		codeUrl: buildUrl + "/f3403fbb3e2b59ae23b2d8fd9c184644.wasm.br",
		// #if MEMORY_FILENAME
		//         memoryUrl: buildUrl + "/",
		// #endif
		// #if SYMBOLS_FILENAME
		//         symbolsUrl: buildUrl + "/",
		// #endif
		streamingAssetsUrl: "StreamingAssets",
		companyName: "TallTeam",
		productName: "Smash Karts",
		productVersion: "2.16.008",
	};
	//the four build files, absolute so they compare with resource timing entry names, for the per file stats in getLoadStats()
	loadTiming.buildFiles = {
		loader: new URL(loaderUrl, document.baseURI).href,
		framework: new URL(config.frameworkUrl, document.baseURI).href,
		wasm: new URL(config.codeUrl, document.baseURI).href,
		data: new URL(config.dataUrl, document.baseURI).href,
	};

	var mainContainer = document.querySelector("#mainContainer");
	var gameContainer = document.querySelector("#gameContainer");
	var canvas = document.querySelector("#gameCanvas");
	var loadingBar = document.querySelector("#loader");
	var progressBarFull = document.querySelector("#loader .progress .full");
	var rotateLandscape = document.querySelector("#rotate-landscape");
	
	if (isMobile())
	{
		mainContainer.className = "unity-mobile";

		// if(isIos())
		// {
		// 	//Allow scrolling on mobile iOS so user can scroll off the top tab bar
		// 	document.body.style.overflow = "visible";
		// }

		if (isAndroid())
		{
			// iOS Safari doesn't support requestFullscreen() on arbitrary elements, so this
			// is Android-only. Reuses the same fullscreen plumbing as the desktop toggle button.
			setElementFullScreen(document.documentElement);

			// Keeps `fs` accurate (e.g. if the player leaves fullscreen via the back button/
			// gesture rather than our own toggle) and shows a "tap to continue" prompt with
			// its own gesture handler to get back into fullscreen, since the one-time
			// first-gesture listener above has already fired and removed itself by then.
			initFullscreenRecovery(document.getElementById("fullscreenPrompt"));
		}
	}
	else
	{
		rotateLandscape.id = "rotateLandscapeOff";
		rotateLandscape.style.display = "none";
	}
	const progress = document.querySelector("#loader .progress");
	progress.style.display = "block";
	progressBarFull.style.width = "0%";

	var script = document.createElement("script");
	script.src = loaderUrl;

	var progressCreateUnityInstance = 0;
	var progressPostCreateUnityInstance = 0;
	var updateProgressInterval = setInterval(updateProgress, 100);

	var gameInstance;
	script.onload = () =>
	{
		createUnityInstance(canvas, config, (progress) =>
		{
			progressCreateUnityInstance = 100 * progress;
			setProgressWidth();
		}).then((unityInstance) =>
		{
			if (isMobile()) document.body.style.background = "#000000";
			loadingBar.style.display = "none";
			window.unityGame = unityInstance;
			gameInstance = unityInstance;

			if (updateProgressInterval) clearInterval(updateProgressInterval);

			loadTiming.unityReadyMs = performance.now();
			var lt = Date.now() - timerStart;
			firebaseLogEventWithParam("loading_page_complete", "time", lt);
			setV(lt);

			onUnityLoadComplete();
		}).catch((message) =>
		{
			alert("TT UnityLoader Error" + message);
		});
	};
	loadTiming.loaderStartMs = performance.now();
	document.body.appendChild(script);

	function onUnityLoadComplete()
	{
		//tell unity what ad providers are enabled
		window.unityGame.SendMessage(unityFirebaseGameOjbectName, "SetDisplayAdProvider", displayAdProvider);
		window.unityGame.SendMessage(unityFirebaseGameOjbectName, "SetVideoAdProvider", videoAdProvider);

		//log AB test assignment to analytics
		if (abTestSelectedProvider) {
			window.unityGame.SendMessage(unityFirebaseGameOjbectName, "OnJSABTestLoaded", abTestSelectedProvider);
		}
		
		trySendAdBlockDetectedMessage();
	}

	function updateProgress()
	{
		if (progressCreateUnityInstance > 85)
		{
			progressPostCreateUnityInstance += 1;
			setProgressWidth();
		}
	}

	function setProgressWidth()
	{
		if (progressCreateUnityInstance == 100.0)
		{
			progressBarFull.style.width = "100%";
		}
		else
		{
			var percent;
			if (isMobile())
			{
				percent = progressCreateUnityInstance * 0.6 + (progressPostCreateUnityInstance * 0.5 * 0.2 + progressCreateUnityInstance * 0.5 * 0.2 * 0.05);
				percent = Math.min(percent, 90);
			}
			else
			{
				percent = progressCreateUnityInstance * 0.9 + progressPostCreateUnityInstance * 0.1;
				percent = Math.min(percent, 95);
			}
			progressBarFull.style.width = percent + "%";
		}
	}

	function setAdinPlaySubIdForABTest(val)
	{
		//set adinplay subid which enables segmented daily reports
		aiptag.subid = val;
	}

    function getAddressableCatalogFilename()
    {
        return addressableCatalogFilename;
    }

    //base url Unity loads the addressables catalog and bundles from, set by the injected build-url-*.js script
    function getAddressablesBaseUrl()
    {
        return (typeof addressablesUrl !== "undefined") ? addressablesUrl : "";
    }

    function getCdnName()
    {
        return (typeof cdnName !== "undefined") ? cdnName : "";
    }

    //true when this load put the player on a CDN for the first time, ie their browser cache for it is cold
    function getCdnIsNew()
    {
        return (typeof cdnIsNew !== "undefined") && cdnIsNew;
    }

    function getReturningBrowser()
    {
        return loadTiming.returningBrowser;
    }

    //which of the four build files a resource timing entry is (loader, framework, wasm, data), "" for anything else
    function getBuildFileKey(url)
    {
        var files = loadTiming.buildFiles;
        if (!files) return "";
        for (var key in files)
        {
            if (files[key] === url) return key;
        }
        return "";
    }

    //where the browser got the file from, read from the sizes resource timing exposes (they need Timing-Allow-Origin on the CDN):
    //n = downloaded over the network (body transferred), c = browser http cache (no request sent),
    //h = 304 revalidation, body from the browser http cache, i = 304 revalidation, body from Unity's IndexedDB cache,
    //u = unknown (sizes hidden). x (not requested) is added by getLoadStats for build files with no entry
    function getEntrySourceCode(e)
    {
        if (e.transferSize === 0 && e.encodedBodySize === 0) return "u";
        if (e.transferSize === 0) return "c";
        if (e.encodedBodySize === 0) return "i";
        //a 304 only transfers headers but reports the cached body's size, a real download transfers at least the body
        if (e.transferSize < e.encodedBodySize) return "h";
        return "n";
    }

    var entrySourceNames = {
        n: "network download",
        c: "browser http cache (no request)",
        h: "revalidated 304, body from browser http cache",
        i: "revalidated 304, body from Unity's IndexedDB cache",
        u: "unknown (sizes hidden, no Timing-Allow-Origin)",
    };

    function getEntrySource(e)
    {
        return entrySourceNames[getEntrySourceCode(e)];
    }

    //total ms at least one of the [start, end] intervals was in flight, overlaps counted once
    function getBusyMs(intervals)
    {
        intervals.sort((a, b) => a[0] - b[0]);
        var busy = 0;
        var runStart = -1;
        var runEnd = -1;
        for (var i = 0; i < intervals.length; i++)
        {
            if (intervals[i][0] > runEnd)
            {
                if (runEnd >= 0) busy += runEnd - runStart;
                runStart = intervals[i][0];
                runEnd = intervals[i][1];
            }
            else if (intervals[i][1] > runEnd)
            {
                runEnd = intervals[i][1];
            }
        }
        if (runEnd >= 0) busy += runEnd - runStart;
        return busy;
    }

    function logBuildFileEntry(key, e)
    {
        var ms = Math.round(e.responseEnd - e.startTime);
        var line = "[LoadTiming] " + key + ": " + ms + " ms (start " + Math.round(e.startTime) + ", end " + Math.round(e.responseEnd) + ")";
        //responseStart is 0 for cross-origin requests without Timing-Allow-Origin
        if (e.responseStart > 0) line += ", first byte " + Math.round(e.responseStart - e.startTime) + " ms, body " + Math.round(e.responseEnd - e.responseStart) + " ms";
        if (e.transferSize > 0) line += ", " + Math.round(e.transferSize / 1024) + " KB transferred";
        if (e.decodedBodySize > 0) line += ", " + Math.round(e.decodedBodySize / 1024) + " KB decoded";
        if (e.nextHopProtocol) line += ", " + e.nextHopProtocol;
        line += ", " + getEntrySource(e) + ", " + e.name;
        console.log(line);
    }

    //Page load milestones plus totals for CDN requests whose url contains pathPart and started at or after sinceMs.
    //cached = served from the browser's http cache, reval = revalidated from Unity's IndexedDB cache (304, no body).
    //kb, cached and reval need a Timing-Allow-Origin header on the CDN, without it the browser hides sizes and they're sent as -1
    //net = ms at least one matching request was in flight (excludes gaps where nothing was downloading, eg the loader parsing the framework before requesting the wasm).
    //loaderMs/frameworkMs/wasmMs/dataMs (+ Kb) = each build file's request start → last byte, -1 when that file wasn't requested.
    //src = one getEntrySourceCode letter per build file in the order loader, framework, wasm, data, x when not requested. "nnnn" = all four freshly downloaded.
    //Each build file is also logged to the console, plus a summary line for every call.
    function getLoadStats(pathPart, sinceMs)
    {
        if (loadTiming.observer) addCdnTimingEntries(loadTiming.observer.takeRecords());

        var stats = {
            now: performance.now(), loaderStart: loadTiming.loaderStartMs, unityReady: loadTiming.unityReadyMs, n: 0, start: -1, end: -1, kb: -1, cached: -1, reval: -1, net: -1,
            loaderMs: -1, frameworkMs: -1, wasmMs: -1, dataMs: -1, loaderKb: -1, frameworkKb: -1, wasmKb: -1, dataKb: -1, src: ""
        };
        var bytes = 0;
        var cached = 0;
        var reval = 0;
        var sizesVisible = false;
        var intervals = [];
        var files = {};

        for (var i = 0; i < loadTiming.cdnEntries.length; i++)
        {
            var e = loadTiming.cdnEntries[i];
            if (e.name.indexOf(pathPart) < 0 || e.startTime < sinceMs) continue;

            stats.n++;
            if (stats.start < 0 || e.startTime < stats.start) stats.start = e.startTime;
            if (e.responseEnd > stats.end) stats.end = e.responseEnd;
            intervals.push([e.startTime, e.responseEnd]);

            //with Timing-Allow-Origin a network response always has transferSize > 0 (headers) and a cache hit has a body size
            var code = getEntrySourceCode(e);
            if (code !== "u")
            {
                sizesVisible = true;
                bytes += e.transferSize;
                if (code === "c") cached++;
                else if (code === "h" || code === "i") reval++;
            }

            //a file requested more than once (eg a retry) covers its first start → last end and the bytes of every request
            var key = getBuildFileKey(e.name);
            if (key)
            {
                var f = files[key];
                if (!f) f = files[key] = { start: e.startTime, end: e.responseEnd, bytes: 0, sizesVisible: false, src: code };
                f.start = Math.min(f.start, e.startTime);
                f.end = Math.max(f.end, e.responseEnd);
                f.bytes += e.transferSize;
                if (code !== "u") f.sizesVisible = true;
                //a network download in any request wins, so a retry after a failed revalidation still reads as a download
                if (code === "n" || f.src === "u") f.src = code;
                logBuildFileEntry(key, e);
            }
        }

        if (sizesVisible)
        {
            stats.kb = Math.round(bytes / 1024);
            stats.cached = cached;
            stats.reval = reval;
        }

        if (stats.n > 0) stats.net = Math.round(getBusyMs(intervals));

        for (var fileKey in files)
        {
            stats[fileKey + "Ms"] = Math.round(files[fileKey].end - files[fileKey].start);
            if (files[fileKey].sizesVisible) stats[fileKey + "Kb"] = Math.round(files[fileKey].bytes / 1024);
        }

        //only for calls that cover the build files, "" for addressables calls
        if (loadTiming.buildFiles && loadTiming.buildFiles.loader.indexOf(pathPart) >= 0)
        {
            for (var buildKey in loadTiming.buildFiles) stats.src += files[buildKey] ? files[buildKey].src : "x";
        }

        console.log("[LoadTiming] " + pathPart + " since " + Math.round(sinceMs) + ": " + stats.n + " requests"
            + (stats.n > 0 ? ", first start " + Math.round(stats.start) + " → last end " + Math.round(stats.end) + " = " + Math.round(stats.end - stats.start) + " ms elapsed, " + stats.net + " ms with a download in flight" : "")
            + ", " + (stats.kb >= 0 ? stats.kb + " KB transferred, " + stats.cached + " from http cache, " + stats.reval + " revalidated" : "sizes hidden (no Timing-Allow-Origin)")
            + (stats.src ? ", src " + stats.src + " (loader, framework, wasm, data)" : ""));

        return JSON.stringify(stats);
    }

</script>
